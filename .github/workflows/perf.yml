# Performance smoke test, on pull requests the Valxel SDLC labels valxel:perf-smoke or
# valxel:perf-full. WorkerPerfTest sends a burst of 3,000 events through real Kafka and Postgres
# (Testcontainers) on main's code and then the PR's, on this runner: seconds until 95% are in the
# store, events per second, and parked events. perf/compare.py posts "perf-smoke / report": failed
# when the PR is more than 20% slower than main or misses the budget (5 s, under 1% errors).
name: perf

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf-smoke:
    name: perf-smoke
    if: contains(github.event.pull_request.labels.*.name, 'valxel:perf-smoke') || contains(github.event.pull_request.labels.*.name, 'valxel:perf-full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Load main's code, then the PR's, the same way
        run: |
          mkdir -p out
          # main may predate the test: then the PR is judged against the budget only.
          (cd main && ./gradlew test --tests '*WorkerPerfTest' -Dperf.out="$GITHUB_WORKSPACE/out/main.json" -x jacocoTestReport) || true
          (cd pr && ./gradlew test --tests '*WorkerPerfTest' -Dperf.out="$GITHUB_WORKSPACE/out/pr.json" -x jacocoTestReport)
      - name: Judge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 pr/perf/compare.py --kind event-worker --run out/pr.json --reference out/main.json --regression 20 --context "perf-smoke / report"
